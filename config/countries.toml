# =============================================================================
# Country settings: every country-specific number the simulator and dashboard use.
#
#   !!  ALL VALUES ARE APPROXIMATE  !!
#   They are rough, believable figures picked for a hackathon demo, NOT
#   measurements or official data. Prices, loads, capacities and temperatures
#   are ballpark. Building names are made up. Check real tariffs and grid data
#   before using any of this for a real decision.
#
# HOW TO ADD A COUNTRY
#   Copy one whole [countries.<id>] block (everything down to the next
#   [countries.<id>] line), paste it at the end, give it a new <id>, and change
#   the values. That's all: it appears in the dashboard's country dropdown.
#   No code changes needed.
#
# Each country has a STRESS EVENT: what strains its grid in the demo (a heat wave in
# Texas, a winter cold snap in Germany). It runs from start_hour to end_hour on the demo
# day; the "Normal day earnings" tab shows a day without it.
#
# Coordinates are [latitude, longitude]. Zones are 4-corner shapes that tile one
# section of the grid (no gaps, no overlaps) and must sit on land; homes are
# placed at random inside them. "water" lists nearby lakes/rivers to avoid.
# =============================================================================


# -----------------------------------------------------------------------------
# United States: Austin, Texas (Windsor Park area, northeast Austin)
# -----------------------------------------------------------------------------
[countries.us_texas]
name = "United States · Austin, Texas"
region = "Windsor Park, Austin"
approximate = true
currency = "$"
clock = "12h"                            # how times are written: 12h (2 PM) or 24h (14:00)
temperature_unit = "F"                   # how temperatures are shown: "C" or "F"

nominal_voltage = 240.0                  # V, split-phase home supply
voltage_tolerance_pct = 5                # normal band is ±5% (approx.)

[countries.us_texas.map]
center = [30.309, -97.688]
zoom = 14.0

[countries.us_texas.battery]             # one home battery (approx.)
capacity_kwh = 20
max_kw = 10

[countries.us_texas.prices]              # $ per kWh (approx., time-of-use / dynamic plan)
night = 0.11
cheap_solar = 0.05                       # 10 am - 3 pm, lots of solar
evening_peak = 0.25                      # 5 - 9 pm on a normal day

[countries.us_texas.temperature_c]       # outdoor temperature (approx.)
night = 26                               # coolest part of a normal day
daily_rise = 10                          # how much warmer it gets by mid-afternoon

[countries.us_texas.home_load_kw]        # per home (approx.)
ev_charger = 7.2                         # Level 2 charger, overnight

[countries.us_texas.flexible_load]       # load that can wait an hour or two (approx.)
name = "EV charger and pool pump"
daytime_kw = 1.5                         # pool pump, noon - 6 pm

[countries.us_texas.stress_event]        # what strains the grid in the demo (approx.)
name = "Heat wave"
start_hour = 14                          # 2 pm
end_hour = 20                            # 8 pm
temperature_change_c = 8                 # degrees warmer than a normal day
extra_home_load_kw = [3.0, 5.0]          # air conditioning, per home (random between these)
thermostat_nudge_kw = 1.0                # flexible: AC set a degree warmer
other_customers_factor = 1.5             # everyone else's load goes up this much
buildings_factor = 1.25                  # critical buildings' load goes up this much
price = 0.50                             # $ per kWh during the event
peak_price = 1.20                        # from 4 pm until it ends (wholesale spikes can go far higher)

[countries.us_texas.household_mix]       # how common each household type is (relative weights)
regular = 7
vulnerable = 2
medical = 1
flexible_share = 0.4                     # share of regular homes with flexible load

[[countries.us_texas.zones]]
name = "North Windsor Park"
shape = [[30.3180, -97.7000], [30.3180, -97.6760], [30.3130, -97.6760], [30.3130, -97.7000]]
capacity_kw = 560   # approx., set so the demo stress event strains this zone at the right time
other_customers_kw = 250                 # other homes and shops at their evening peak (approx.)

[[countries.us_texas.zones]]
name = "West Windsor Park"
shape = [[30.3130, -97.7000], [30.3130, -97.6880], [30.3060, -97.6880], [30.3060, -97.7000]]
capacity_kw = 480
other_customers_kw = 250

[[countries.us_texas.zones]]
name = "East Windsor Park"
shape = [[30.3130, -97.6880], [30.3130, -97.6760], [30.3060, -97.6760], [30.3060, -97.6880]]
capacity_kw = 560
other_customers_kw = 250

[[countries.us_texas.zones]]
name = "South Windsor Park"
shape = [[30.3060, -97.7000], [30.3060, -97.6760], [30.3000, -97.6760], [30.3000, -97.7000]]
capacity_kw = 520
other_customers_kw = 250

[[countries.us_texas.water]]             # Mueller Lake, just south-west of the region
name = "Mueller Lake"
shape = [[30.2990, -97.7080], [30.2990, -97.7020], [30.2940, -97.7020], [30.2940, -97.7080]]

[[countries.us_texas.critical_buildings]]
id = "HOSP-1"
name = "Windsor Park Medical Center"     # made-up name
type = "hospital"
location = [30.3095, -97.6820]
load_kw = 150                            # approx.
backup = "Diesel generator"
backup_hours = 24

[[countries.us_texas.critical_buildings]]
id = "FIRE-1"
name = "Fire Station 17"                 # made-up name
type = "fire_station"
location = [30.3030, -97.6900]
load_kw = 15
backup = "Battery"
backup_hours = 8

[[countries.us_texas.critical_buildings]]
id = "COLD-1"
name = "Food Bank Cold Storage"          # made-up name
type = "cold_storage"
location = [30.3100, -97.6950]
load_kw = 40
backup = "None"
backup_hours = 0


