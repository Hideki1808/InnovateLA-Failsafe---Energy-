# Look and feel of the dashboard.
# Style: an operations console, in the spirit of Datadog and Dynatrace. Cool light-grey
# page, white square-cornered widgets with thin borders, dense but calm, one indigo
# accent for controls, and status colors that mean the same thing everywhere.
# Font: Geist (modern, neutral) and Geist Mono for numbers and tags.

[theme]
base = "light"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
baseFontSize = 15                    # dense console text, still readable on a projector
baseRadius = "4px"                   # square-ish corners
buttonRadius = "4px"
paddingTop = "0.5rem"

backgroundColor = "#f3f4f7"          # cool light-grey page
secondaryBackgroundColor = "#ffffff" # widgets and inputs are white
textColor = "#1d2129"                # near-black, slightly cool
borderColor = "#dfe2e8"              # thin widget borders
showWidgetBorder = true
primaryColor = "#4f46e5"             # indigo: buttons, toggles, the slider, selected tab

# Status colors (the same as the map dots and the tiles)
redColor = "#e5484d"                 # critical: Needs dispatcher, outages
yellowColor = "#f0a30a"              # warning: Watch
blueColor = "#3b82f6"                # info: Can wait
greenColor = "#22a55b"               # ok: Normal
orangeColor = "#f97316"              # busy zones
violetColor = "#c026d3"              # medical homes
redBackgroundColor = "#fde8e8"
yellowBackgroundColor = "#fef3d6"
blueBackgroundColor = "#e6effe"
greenBackgroundColor = "#e3f5ea"
chartCategoricalColors = ["#4f46e5", "#0ea5e9", "#22a55b", "#f0a30a", "#c026d3", "#64748b"]

[client]
toolbarMode = "minimal"              # hide the developer menu during the demo
