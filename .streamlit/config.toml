# Look and feel of the dashboard.
# Style: minimal and calm. Light grey page, white cards with thin 1 px borders, small
# corners, deep forest-green ink and buttons, a soft mint accent, and small monospace
# uppercase labels. Red is kept for alarms only. Readable on a projector.

[theme]
base = "light"
# Fonts (free Google Fonts):
#   body text:            Inter, a clean neutral sans
#   headings and numbers: Hanken Grotesk, a crisp geometric grotesk
#   labels and tags:      JetBrains Mono (small uppercase "tags" like SCENARIO)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Hanken Grotesk:https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap"
baseFontSize = 16                    # still readable from the back of the room
baseRadius = "10px"                  # small corners
buttonRadius = "8px"                 # rectangular buttons with a soft corner
paddingTop = "1rem"

backgroundColor = "#f5f6f3"          # light grey page
secondaryBackgroundColor = "#ffffff" # cards and inputs are white
textColor = "#0f2416"                # deep green-black ink
borderColor = "#e3e6e0"              # thin borders
showWidgetBorder = true
primaryColor = "#123d1f"             # forest green: buttons, toggles, the slider

# Status colors (the same as the map dots)
redColor = "#e5484d"                 # Needs dispatcher / alarms
yellowColor = "#d99a00"              # Watch
blueColor = "#2f6fdb"                # Can wait
greenColor = "#2e9e5b"               # Normal
orangeColor = "#f08a24"              # busy zones
violetColor = "#7b4fd6"              # medical homes
redBackgroundColor = "#fde8e8"
yellowBackgroundColor = "#fdf3d8"
blueBackgroundColor = "#e9f0fc"
greenBackgroundColor = "#e3f6e0"
chartCategoricalColors = ["#123d1f", "#2f6fdb", "#2e9e5b", "#d99a00", "#7b4fd6"]

[client]
toolbarMode = "minimal"              # hide the developer menu during the demo
