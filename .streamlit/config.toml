# Look and feel of the dashboard.
# Style: off-white page, clean white rounded panels, ONE coral-red accent used
# sparingly (headings, key numbers, urgent alerts), simple sans-serif type, lots of
# space. Built for a projector: large base font and strong contrast.

[theme]
base = "light"
# Fonts picked to match the reference look (closest free Google Fonts):
#   body text and big numbers: Inter Tight, a tight Helvetica-style grotesk
#   headings and the title:    Outfit, a geometric rounded sans
font = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap"
baseFontSize = 18                    # readable from the back of the room
baseRadius = "16px"                  # soft rounded corners on panels and widgets
buttonRadius = "999px"               # pill-shaped buttons
paddingTop = "1.5rem"

backgroundColor = "#f2f1ef"          # off-white / light gray page
secondaryBackgroundColor = "#ffffff" # panels and inputs are white
textColor = "#1c1c1e"                # near-black ink
borderColor = "#e4e2df"              # very light borders, barely there
showWidgetBorder = false
primaryColor = "#1c1c1e"             # controls stay ink-black: coral is saved for what matters

# Status colors. Coral red is the accent AND "Needs dispatcher" (same as the map dots).
redColor = "#e8453c"                 # Needs dispatcher / strained / accent
yellowColor = "#e0a100"              # Watch
blueColor = "#2f6fdb"                # Can wait
greenColor = "#2e9e5b"               # Normal
orangeColor = "#f08a24"              # busy zones
violetColor = "#7b4fd6"              # medical homes
redBackgroundColor = "#fdecea"
yellowBackgroundColor = "#fdf5df"
blueBackgroundColor = "#e9f0fc"
greenBackgroundColor = "#e8f5ee"
chartCategoricalColors = ["#e8453c", "#2f6fdb", "#2e9e5b", "#e0a100", "#7b4fd6"]

[client]
toolbarMode = "minimal"              # hide the developer menu during the demo
